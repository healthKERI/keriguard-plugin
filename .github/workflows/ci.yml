name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify locksmith access
        env:
          LOCKSMITH_TOKEN: ${{ secrets.LOCKSMITH_TOKEN }}
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            -H "Authorization: Bearer ${LOCKSMITH_TOKEN}" \
            https://api.github.com/repos/healthKERI/locksmith

      - name: Install plugins
        env:
          LOCKSMITH_TOKEN: ${{ secrets.LOCKSMITH_TOKEN }}
        run: |
          AUTH_B64="$(printf 'x-access-token:%s' "${LOCKSMITH_TOKEN}" | base64 -w0)"
          git config --global http.https://github.com/.extraheader "Authorization: basic ${AUTH_B64}"
          # Prove the credential works for the private clone before pip runs
          git ls-remote https://github.com/healthKERI/locksmith.git HEAD >/dev/null \
            && echo "locksmith clone auth OK" || { echo "locksmith clone auth FAILED"; exit 1; }
          python -m venv /tmp/venv
          source /tmp/venv/bin/activate
          pip install --upgrade pip
          pip install -e plugins/user
          # keriguard-admin depends on locksmith==0.0.1, which is not the
          # PyPI package of that name (an unrelated project). Install the
          # real locksmith from source first so the requirement resolves
          # against it instead of failing / pulling the wrong package.
          pip install "locksmith @ git+https://github.com/healthKERI/locksmith.git"
          pip install -e plugins/admin

      - name: Import smoke test
        run: |
          source /tmp/venv/bin/activate
          python -c "import keriguard_user"
          python -c "import keriguard_admin"