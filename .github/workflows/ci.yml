name: CI

on:
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify locksmith access
        env:
          LOCKSMITH_TOKEN: ${{ secrets.LOCKSMITH_TOKEN }}
        run: |
          # Length as stored vs. length after stripping whitespace — should be equal
          printf '%s' "${LOCKSMITH_TOKEN}" | wc -c
          printf '%s' "${LOCKSMITH_TOKEN}" | tr -d '[:space:]' | wc -c
          # Also test git auth directly with the token as password
          echo "https://x-access-token:${LOCKSMITH_TOKEN}@github.com" | \
            grep -c $'\n' && echo "WARNING: newline in token" || true
          curl -sS -o /dev/null -w "%{http_code}\n" \
            -H "Authorization: Bearer ${LOCKSMITH_TOKEN}" \
            https://api.github.com/repos/healthKERI/locksmith

      - name: Install plugins
        env:
          LOCKSMITH_TOKEN: ${{ secrets.LOCKSMITH_TOKEN }}
        run: |
          # Strip any stray whitespace/newlines from the secret
          TOKEN="$(printf '%s' "${LOCKSMITH_TOKEN}" | tr -d '[:space:]')"
          git config --global credential.helper \
            "!f() { echo username=x-access-token; echo \"password=${TOKEN}\"; }; f"
          # Prove the credential works for the private clone before pip runs
          git ls-remote https://github.com/healthKERI/locksmith.git HEAD >/dev/null \
            && echo "locksmith clone auth OK" || { echo "locksmith clone auth FAILED"; exit 1; }
          python -m venv /tmp/venv
          source /tmp/venv/bin/activate
          pip install --upgrade pip
          pip install -e plugins/user
          pip install "locksmith @ git+https://github.com/healthKERI/locksmith.git"
          pip install -e plugins/admin

      - name: Import smoke test
        run: |
          source /tmp/venv/bin/activate
          python -c "import keriguard_user"
          python -c "import keriguard_admin"